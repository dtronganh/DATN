<app-navbar />

<app-breadcrumb
  [title]="'profile.wishlist' | translate"
  [items]="[{ label: ('nav.home' | translate), link: '/' }, { label: ('profile.wishlist' | translate) }]"
/>

<div class="sticker-safe">
<div class="s-py-100" data-aos="fade-up">
  <div class="container-fluid">
    <div
      class="max-w-[1720px] mx-auto flex items-start gap-5 md:gap-6 2xl:gap-10 flex-col md:flex-row my-profile-navtab">
      <div class="w-full flex-none" style="max-width: 280px">
        <app-account-tab />
      </div>
      <div class="w-full min-w-0" style="flex: 1">

        @if (wishlistStore.count() === 0) {
        
        <div class="bg-[#F8F8F9] dark:bg-dark-secondary border-t-2 border-primary p-10 sm:p-16 text-center">
          <div class="w-20 h-20 bg-primary/10 dark:bg-[#0f1923] rounded flex items-center justify-center mx-auto mb-5">
            <i class="mdi mdi-heart-off-outline text-4xl text-gray-400"></i>
          </div>
          <h3 class="text-xl font-bold dark:text-white text-title mb-2">{{ 'profile.wishlistPage.emptyTitle' | translate }}</h3>
          <p class="text-gray-500 dark:text-gray-400 text-sm mb-6">{{ 'profile.wishlistPage.emptyDesc' | translate }}</p>
          <a [routerLink]="'/shop'"
            class="inline-flex items-center gap-2 px-5 py-3 bg-primary text-white text-sm font-semibold rounded hover:bg-opacity-90 transition-colors duration-200">
            <i class="mdi mdi-storefront-outline"></i>
            {{ 'profile.wishlistPage.browseProducts' | translate }}
          </a>
        </div>

        } @else {
        
        <div class="bg-primary dark:bg-[#0f1923] px-5 sm:px-7 py-4 flex items-center justify-between mb-[2px]">
          <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-white/20 rounded flex items-center justify-center flex-none">
              <i class="mdi mdi-heart text-white text-base"></i>
            </div>
            <h3 class="text-white font-bold text-sm uppercase tracking-wider leading-none">
              {{ 'profile.wishlistPage.itemsCount' | translate:{ count: wishlistStore.count() } }}
            </h3>
          </div>
          <button (click)="clearWishlist()"
            class="flex items-center gap-1.5 text-xs font-semibold text-white/80 hover:text-white border border-white/30 hover:border-white px-3 py-1.5 rounded transition-colors duration-200 uppercase tracking-wider">
            <i class="mdi mdi-delete-outline text-sm"></i>
            {{ 'profile.wishlistPage.clearAll' | translate }}
          </button>
        </div>

        <div class="bg-[#F8F8F9] dark:bg-dark-secondary border-t-2 border-primary p-5 sm:p-7">
          <app-product-card
            [productList]="wishlistStore.items()"
            classList="grid grid-cols-2 sm:grid-cols-2 lg:grid-cols-3 gap-5 sm:gap-6 lg:gap-8"
            (onAddToCart)="onAddToCart($event)">
            <ng-template #actionsTemplate let-item>
              <button (click)="onAddToCart(item)"
                class="bg-white dark:bg-title dark:text-white bg-opacity-90 flex items-center justify-center gap-2 px-4 py-3 text-sm leading-none text-title rounded font-semibold h-12 overflow-hidden new-product-icon border border-bdr-clr dark:border-bdr-clr-drk hover:bg-primary hover:text-white hover:border-primary transition-colors duration-200">
                <i class="mdi mdi-cart-plus dark:text-white text-[18px]"></i>
                <span>{{ 'profile.wishlistPage.addToCart' | translate }}</span>
              </button>
              <button (click)="removeFromWishlist(item.id)"
                class="bg-white dark:bg-title dark:text-white bg-opacity-90 flex items-center justify-center gap-2 px-4 py-3 text-sm leading-none text-title rounded font-semibold h-12 overflow-hidden new-product-icon border border-bdr-clr dark:border-bdr-clr-drk hover:border-red-500 hover:text-red-500 transition-colors duration-200">
                <i class="mdi mdi-heart-remove-outline text-red-500 text-[18px]"></i>
                <span>{{ 'profile.wishlistPage.remove' | translate }}</span>
              </button>
            </ng-template>
          </app-product-card>
        </div>
        }
      </div>
    </div>
  </div>
</div>

</div>

<app-footer />
