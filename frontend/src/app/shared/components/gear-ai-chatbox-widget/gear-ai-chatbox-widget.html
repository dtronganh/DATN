<div
  *ngIf="gearChatboxVisible()"
  class="pointer-events-none fixed bottom-12 right-4 z-50 flex flex-col items-end md:bottom-16 md:right-6"
>
  <div
    class="pointer-events-auto flex h-[min(60vh,504px)] w-[min(92vw,380px)] flex-col overflow-hidden rounded-2xl border border-gray-200 bg-white shadow-2xl transition-all duration-300 ease-out dark:border-slate-700 dark:bg-slate-900"
    [class.mb-3]="gearChatboxOpen()"
    [class.translate-y-0]="gearChatboxOpen()"
    [class.scale-100]="gearChatboxOpen()"
    [class.opacity-100]="gearChatboxOpen()"
    [class.pointer-events-none]="!gearChatboxOpen()"
    [class.translate-y-3]="!gearChatboxOpen()"
    [class.scale-95]="!gearChatboxOpen()"
    [class.opacity-0]="!gearChatboxOpen()"
  >
    <div class="flex items-center justify-between bg-primary px-4 py-3 text-white">
      <div>
        <p class="text-sm font-semibold">{{ gearChatboxTexts().title }}</p>
        <p class="text-xs opacity-90">{{ gearChatboxTexts().subtitle }}</p>
      </div>

      <button
        type="button"
        (click)="closeGearChatbox()"
        class="rounded p-1 transition hover:bg-white/20"
        [attr.aria-label]="gearChatboxTexts().closeLabel"
      >
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <div class="flex-1 space-y-3 overflow-y-auto p-4">
      <div *ngFor="let message of gearChatboxMessages(); let idx = index">
        <div
          class="max-w-[90%] rounded-xl px-3 py-2 text-sm leading-6"
          [class.ml-auto]="message.role === 'user'"
          [class.bg-primary]="message.role === 'user'"
          [class.text-white]="message.role === 'user'"
          [class.bg-gray-100]="message.role === 'assistant'"
          [class.text-gray-800]="message.role === 'assistant'"
          [class.dark:bg-slate-800]="message.role === 'assistant'"
          [class.dark:text-slate-100]="message.role === 'assistant'"
        >
          <p class="whitespace-pre-wrap">{{ message.content }}</p>
        </div>

        <div *ngIf="message.suggestions?.length" class="mt-2 space-y-2">
          <a
            *ngFor="let item of message.suggestions | slice:0:5"
            class="block rounded-lg border border-gray-200 px-3 py-2 text-xs transition hover:border-primary hover:bg-gray-50 dark:border-slate-700 dark:hover:bg-slate-800"
            [routerLink]="['/product-details', item.slug || item.id]"
          >
            <p class="truncate font-medium text-gray-900 dark:text-white">{{ item.name }}</p>
            <p class="mt-1 text-primary">
              {{ formatGearChatboxPrice(item.price) }} đ • {{ formatGearChatboxStock(item.stock) }}
            </p>
          </a>
        </div>
      </div>

      <div
        *ngIf="gearChatboxLoading()"
        class="max-w-[90%] rounded-xl bg-gray-100 px-3 py-2 text-sm text-gray-700 dark:bg-slate-800 dark:text-slate-200"
      >
        {{ gearChatboxTexts().processing }}
      </div>
    </div>

    <form
      class="flex gap-2 border-t border-gray-200 p-3 dark:border-slate-700"
      (submit)="$event.preventDefault(); submitGearChatbox()"
    >
      <input
        [ngModel]="gearChatboxInput()"
        (ngModelChange)="onGearChatboxInputChange($event)"
        name="gearChatboxInput"
        [placeholder]="gearChatboxTexts().inputPlaceholder"
        class="h-10 flex-1 rounded-lg border border-gray-300 px-3 text-sm outline-none transition focus:border-primary dark:border-slate-600 dark:bg-slate-950 dark:text-slate-100"
      />
      <button
        type="submit"
        [disabled]="!gearChatboxCanSend()"
        class="h-10 rounded-lg bg-primary px-4 text-sm font-medium text-white transition hover:opacity-90 disabled:cursor-not-allowed disabled:opacity-50"
      >
        {{ gearChatboxTexts().send }}
      </button>
    </form>
  </div>

  <button
    type="button"
    (click)="toggleGearChatbox()"
    class="pointer-events-auto flex size-14 animate-pulse items-center justify-center rounded-full bg-primary text-xl text-white shadow-xl transition duration-300 hover:scale-105 hover:bg-black"
    [attr.aria-label]="gearChatboxTexts().openLabel"
  >
    <i class="fa-solid fa-comments"></i>
  </button>
</div>
