<div [class]="classList()">
  @for (item of productList(); track item.id) {
    @if (variant() === 'default') {
      <div class="group border border-gray-200 dark:border-gray-700 rounded overflow-hidden flex flex-col h-full">
        <div class="relative overflow-hidden aspect-square">
          <a [routerLink]="['/product-details',item.slug || item.id]" class="block w-full h-full">
            <img class="w-full h-full object-cover transform group-hover:scale-110 duration-300" [src]="item.thumbnail" [alt]="item.name">
          </a>
          <div class="absolute z-10 top-[70%] right-3  opacity-0 duration-300 transition-all group-hover:-translate-y-1/2 group-hover:opacity-100 flex flex-col items-end gap-3">
            @if (actionsTemplate()) {
              <ng-container *ngTemplateOutlet="actionsTemplate(); context: { $implicit: item }" />
            } @else {
              <button (click)="toggleWishlist(item, $event)" class="bg-white dark:bg-title dark:text-white bg-opacity-80 flex items-center justify-center gap-2 px-4 py-[10px] text-base leading-none text-title rounded-[40px] h-14 overflow-hidden new-product-icon">
                <i [class]="isInWishlist(item.id) ? 'mdi mdi-cards-heart dark:text-white text-[24px] text-red-500' : 'mdi mdi-cards-heart-outline dark:text-white text-[24px]'"></i>
                <span class="mt-1">{{ isInWishlist(item.id) ? ('product.inWishlist' | translate) : ('wishlist.add' | translate) }}</span>
              </button>
              <button (click)="addToCart(item, $event)" class="bg-white dark:bg-title dark:text-white bg-opacity-80 flex items-center justify-center gap-2 px-4 py-[10px] text-base leading-none text-title rounded-[40px] h-14 overflow-hidden new-product-icon">
                <i class="mdi mdi-shopping-outline dark:text-white text-[24px]"></i>
                <span class="mt-1">{{ 'product.addToCart' | translate }}</span>
              </button>
            }
          </div>
        </div>
        <div class="px-3 md:px-4 lg:px-5 pt-3 pb-3 flex gap-2 flex-col flex-1">
          <h5 class="font-normal dark:text-white text-sm sm:text-base leading-[1.4] line-clamp-3">
            <a [routerLink]="['/product-details',item.slug || item.id]" class="text-underline">{{item.name}}</a>
          </h5>
          <h4 class="font-semibold text-primary text-base sm:text-lg">{{formatVND(item.price)}}₫</h4>
          <app-rating [rating]="0" [showStock]="true" [stock]="item.stock" />
        </div>
      </div>
    }
    @if (variant() === 'compact') {
      <div class="relative overflow-hidden group border border-gray-200 dark:border-gray-700 rounded aspect-square">
        <a [routerLink]="['/product-details',item.slug || item.id]" class="block w-full h-full">
          <img class="w-full h-full object-cover transform duration-300 group-hover:scale-110" [src]="item.thumbnail" [alt]="item.name">
        </a>
        <div class="flex flex-col items-start gap-2 absolute z-20 w-11/12 bottom-3 xl:bottom-5 left-[4%] p-3 xl:p-4 bg-white dark:bg-title bg-opacity-[85%] dark:bg-opacity-[85%] group-hover:-translate-y-1/2 duration-500 group-hover:opacity-0 group-hover:invisible">
          <h5 class="font-normal dark:text-white text-sm sm:text-base leading-[1.4] line-clamp-3">
            <a [routerLink]="['/product-details', item.slug || item.id]" class="line-clamp-3">{{item.name}}</a>
          </h5>
          <h4 class="font-semibold text-primary text-base sm:text-lg">{{formatVND(item.price)}}₫</h4>
          <app-rating [rating]="4" [showStock]="true" [stock]="item.stock" />
        </div>
        <div class="absolute z-10 flex gap-2 justify-center bottom-5 md:bottom-7 w-full transform translate-y-5 opacity-0 duration-500 invisible group-hover:translate-y-0 group-hover:opacity-100 group-hover:visible">
          <button (click)="toggleWishlist(item, $event)" class="w-9 lg:w-12 h-9 p-2 lg:h-12 bg-white dark:bg-title bg-opacity-80 flex items-center justify-center relative tooltip-icon rounded-full">
            <i [class]="isInWishlist(item.id) ? 'mdi mdi-cards-heart dark:text-white text-[24px] text-red-500' : 'mdi mdi-cards-heart-outline dark:text-white text-[24px]'"></i>
            <span class="p-2 bg-white dark:bg-title text-xs text-title dark:text-white absolute -top-[60px] left-1/2 whitespace-nowrap rounded-[4px] opacity-0 invisible duration-300" style="transform: translateX(-50%)">{{ isInWishlist(item.id) ? ('product.inWishlist' | translate) : ('wishlist.add' | translate) }}
              <span class="w-3 h-3 bg-white dark:bg-title absolute -bottom-[6px] left-1/2 rotate-45" style="transform: translateX(-50%)"></span>
            </span>
          </button>
          <button (click)="addToCart(item, $event)" class="w-9 lg:w-12 h-9 p-2 lg:h-12 bg-white dark:bg-title bg-opacity-80 flex items-center justify-center relative tooltip-icon rounded-full">
            <i class="mdi mdi-shopping-outline dark:text-white text-[24px]"></i>
            <span class="p-2 bg-white dark:bg-title text-xs text-title dark:text-white absolute -top-[60px] left-1/2 whitespace-nowrap rounded-[4px] opacity-0 invisible duration-300" style="transform: translateX(-50%)">{{ 'product.addToCart' | translate }}
              <span class="w-3 h-3 bg-white dark:bg-title absolute -bottom-[6px] left-1/2 rotate-45" style="transform: translateX(-50%)"></span>
            </span>
          </button>
        </div>
      </div>
    }
  }
</div>
